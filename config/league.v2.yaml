# Model-affecting league configuration (DraftEngineDesign.md §10.2).
#
# THE RULE: if changing a value changes a projection, it belongs here.
# Everything else belongs in strategy.yaml.
#
# Changing ANYTHING in this file re-hashes model_version and requires:
#   bash scripts/run_pipeline.sh && python scripts/audit_power.py
#
# Named league.v2.yaml during the migration so the v1 readers keep working
# against config/league.yaml. Phase 5 (§22.1) renames this to league.yaml once
# the last v1 reader is gone.

league:
  teams: 12
  type: snake # snake | linear
  kind: redraft

roster:
  slots: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, K: 1, DST: 1, BENCH: 6 }
  # slot_name -> positions that slot accepts. Supports SUPERFLEX and multiple
  # flex slots, including overlapping ones (which make the family non-laminar
  # and switch the lineup oracle from counters to matching — §15.3).
  flex_eligibility:
    FLEX: [RB, WR, TE]
  modeled_positions: [QB, RB, WR, TE] # K/DST use empirical distributions (§12.5)

schedule:
  regular_season_weeks: 14
  playoff_weeks: [15, 16, 17]
  playoff_teams: 6
  playoff_byes: 2
  matchup_length_weeks: 1
  seeding_tiebreakers: [wins, points_for, head_to_head]

scoring:
  offense:
    pass_yd: 0.04 # 25 yards = 1 point
    pass_td: 4
    int: -1
    rush_yd: 0.1 # 10 yards = 1 point
    rush_td: 6
    rec: 1 # full PPR
    rec_yd: 0.1
    rec_td: 6
    return_td: 6
    two_pt: 2
    fumble_lost: -2
    # MEASURED 2026-08-04: derivable from player_stats.fumble_recovery_tds
    # (39 events across 2012-2025). Earlier revisions listed this as an
    # unimplemented scoring exception; it is simply scored.
    off_fumble_return_td: 6
  kicker:
    pat: 1
    # [min_yards, max_yards, points], inclusive. MEASURED: player_stats ships
    # fg_made_0_19 / 20_29 / 30_39 / 40_49 / 50_59 / 60_ at 0% null, which map
    # onto these bands exactly. No play-by-play derivation needed.
    fg_bands: [[0, 39, 3], [40, 49, 4], [50, 99, 5]]
    fg_miss: 0
  dst:
    sack: 1
    interception: 2
    fumble_recovery: 2
    td: 6
    safety: 2
    blocked_kick: 2
    return_td: 6
    extra_point_returned: 2
    # [min_allowed, max_allowed, points], inclusive
    points_allowed_tiers:
      [
        [0, 0, 10],
        [1, 6, 7],
        [7, 13, 4],
        [14, 20, 1],
        [21, 27, 0],
        [28, 34, -1],
        [35, 999, -4],
      ]

# Scoring components this league awards that cannot be computed from the data.
# MEASURED 2026-08-04: none. The mechanism stays because a future league rule
# may have no nflverse column.
scoring_exceptions: []

training:
  min_games_train: 8 # label-quality floor, NOT replacement level
  ewm_halflife_seasons: 1.0
  min_train_seasons: 5 # expanding-fold warmup before OOF is emitted
  min_bucket_n: 30
  # MUST match src/projection/calibrate.py:assign_bucket exactly; validated at
  # load so the key cannot silently do nothing (rule 7).
  calibration_buckets: [rookie, second_year, team_changed_vet, established_vet]

weekly:
  min_games_for_sigma: 8
  # MEASURED weekly sigma/mu medians: QB 0.376, RB 0.584, WR 0.619, TE 0.696.
  # A floor at 0.35 therefore binds only for the lowest-variance quarterbacks,
  # which is what a floor is for.
  sigma_floor_ratio: 0.35
  kdst_cdf_grid: 101

backtest:
  start_season: 2012
  end_season: 2025
  as_of_offset_days: 1
