[tool.pytest.ini_options]
# make `venv/bin/pytest` work standalone: put the repo root on sys.path so
# `from src...` imports resolve without `python -m pytest`
pythonpath = ["."]
testpaths = ["tests"]
# The v1 surfaces (api/, web/, weekly start/sit) and their `v1_frozen` marker
# were deleted outright, so nothing is deselected by default any more. `slow`
# is kept as an opt-OUT (`pytest -m 'not slow'`), which is what it was before —
# it was never in `addopts`.
markers = [
    "slow: hits the network or takes seconds; deselect with -m 'not slow'",
]
